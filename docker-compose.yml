services:
  postgres:
    image: postgres:16-alpine
    container_name: sambung-ngaji-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: pengajian
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: pengajian
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pengajian"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./go
      dockerfile: Dockerfile.dev
    container_name: sambung-ngaji-api
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./go:/app
    env_file:
      - ./go/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Jakarta

  adminer:
    image: adminer:latest
    container_name: sambung-ngaji-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
