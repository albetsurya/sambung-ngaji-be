services:
  - type: web
    name: pengajian-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_EXPIRY_HOURS
        value: "12"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OMNIROUTE_ENDPOINT
        sync: false
      - key: OMNIROUTE_API_KEY
        value: ""
      - key: OMNIROUTE_MODEL
        value: "auto/best-vision"
      - key: OMNIROUTE_TIMEOUT_SEC
        value: "60"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: GEMINI_API_KEY
        value: ""
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"
